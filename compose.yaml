services:
  shadowshield:
    build:
      context: .
    environment:
      SHADOWSHIELD_API_KEY: ${SHADOWSHIELD_API_KEY:?Set SHADOWSHIELD_API_KEY before starting}
      SHADOWSHIELD_CORS_ORIGINS: ${SHADOWSHIELD_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
