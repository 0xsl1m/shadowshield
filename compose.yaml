services:
  shadowshield:
    image: ghcr.io/0xsl1m/shadowshield@${SHADOWSHIELD_IMAGE_DIGEST:?Set SHADOWSHIELD_IMAGE_DIGEST to the release sha256 digest}
    environment:
      SHADOWSHIELD_API_KEY: ${SHADOWSHIELD_API_KEY:?Set SHADOWSHIELD_API_KEY before starting}
      SHADOWSHIELD_ADMIN_KEY: ${SHADOWSHIELD_ADMIN_KEY:?Set SHADOWSHIELD_ADMIN_KEY before starting}
      SHADOWSHIELD_POLICY_KEY: ${SHADOWSHIELD_POLICY_KEY:?Set SHADOWSHIELD_POLICY_KEY before starting}
      SHADOWSHIELD_POLICY_STATE_KEY: ${SHADOWSHIELD_POLICY_STATE_KEY:?Set an independent 32-byte SHADOWSHIELD_POLICY_STATE_KEY before starting}
      SHADOWSHIELD_POLICY_STATE_PATH: /var/lib/shadowshield/policy-state.json
      SHADOWSHIELD_CORS_ORIGINS: ${SHADOWSHIELD_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - policy-state:/var/lib/shadowshield
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  policy-state:
