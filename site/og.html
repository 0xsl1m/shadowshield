<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShadowShield — security for agentic AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { color: #edf8f7; font-family: Arial, sans-serif; background: #071114; }
    .art { position: absolute; width: 1200px; height: 630px; object-fit: cover; opacity: .72; }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #071114 0%, rgba(7,17,20,.96) 31%, rgba(7,17,20,.2) 82%); }
    .frame { position: absolute; inset: 32px; border: 1px solid rgba(168,218,210,.24); }
    .copy { position: absolute; left: 76px; top: 65px; width: 630px; }
    .brand { font-weight: 800; letter-spacing: .16em; font-size: 19px; }
    .brand span { color: #8ed9c8; }
    .kicker { margin-top: 72px; color: #8ed9c8; font: 12px monospace; letter-spacing: .16em; }
    h1 { margin: 24px 0 18px; font-size: 74px; line-height: .95; letter-spacing: -.055em; }
    h1 em { font-weight: 400; color: #a7e2d4; }
    p { color: #b8cac8; font-size: 19px; line-height: 1.5; max-width: 440px; }
    .bottom { position: absolute; bottom: 63px; left: 76px; right: 76px; display: flex; justify-content: space-between; color: #b7cbc7; font: 12px monospace; letter-spacing: .1em; text-transform: uppercase; }
    .version { color: #a7e2d4; }
  </style>
</head>
<body>
  <img class="art" src="shield-hero.webp" alt="">
  <div class="shade"></div><div class="frame"></div>
  <div class="copy">
    <div class="brand">SHADOW<span>SHIELD</span></div>
    <div class="kicker">OPEN SOURCE / DEFENSE IN DEPTH</div>
    <h1>Guard the<br><em>unseen.</em></h1>
    <p>Security for the boundary between your agent and untrusted information.</p>
  </div>
  <div class="bottom"><span class="version">v0.10.3 · Agentic-AI Security</span><span>shadowshield.xyz</span></div>
</body>
</html>
