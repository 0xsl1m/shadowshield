name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — NO API token is stored anywhere.
# Fires only when a stable GitHub Release is published.
on:
  release:
    types: [published]

concurrency:
  group: pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: build + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_PRERELEASE" = "false"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git branch --remotes --contains "$GITHUB_SHA" | grep -Fxq "  origin/main"
          package_version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$package_version" = "${RELEASE_TAG#v}"
          successful_ci="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --branch main \
              --event push \
              --status success \
              --json databaseId \
              --jq '.[0].databaseId // empty' \
              --limit 1
          )"
          test -n "$successful_ci"
      - name: Build sdist + wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: \
            --require-hashes -r requirements/build.lock
          python -m build --no-isolation --outdir dist-a
          python -m build --no-isolation --outdir dist-b
          diff \
            <(find dist-a -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find dist-b -maxdepth 1 -type f -printf '%f\n' | sort)
          for artifact in dist-a/*; do
            cmp "$artifact" "dist-b/$(basename "$artifact")"
          done
          mv dist-a dist
          rm -rf dist-b
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write   # REQUIRED for trusted publishing (OIDC); no secrets used
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # Uses the repo's trusted-publisher config on PyPI — see docs/RELEASING.md.
