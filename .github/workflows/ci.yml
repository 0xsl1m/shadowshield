name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint, type-check, and the full test suite WITHOUT the heavy ML
  # stack. Model-backed tests skip themselves when transformers/sentence-transformers
  # aren't installed, so this job is quick (seconds, not minutes) and gates PRs.
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no heavy ML deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,langchain,datasets]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type-check
        # mypy targets our minimum supported syntax (3.10). Run it once on that
        # interpreter so newer-runtime-only dependency stubs (for example NumPy
        # 2.5's PEP 695 aliases) cannot conflict with the configured target.
        if: matrix.python-version == '3.10'
        run: mypy src/shadowshield
      - name: Test
        run: pytest --cov=shadowshield --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.14'
        with:
          name: coverage
          path: coverage.xml

  # Heavy: exercise the optional ML classifier + vector-similarity layers against
  # real models. Separate job so a slow model download never blocks PR feedback.
  ml:
    name: ml-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (with transformers + vectors)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,transformers,vectors,datasets]"
      - name: Run model-backed tests (real models)
        env:
          SHADOWSHIELD_RUN_MODEL_TESTS: "1"
        run: pytest -m integration tests/test_transformer.py tests/test_vector.py
      - name: Verify gated multilingual Prompt Guard and publish benchmark evidence
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHADOWSHIELD_RUN_GATED_MODEL_TESTS: "1"
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}"
          pytest -m integration tests/test_transformer.py -k real_gated_multilingual_model
          shadowshield benchmark \
            --hf deepset/prompt-injections \
            --split test \
            --transformer multilingual \
            --json

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: \
            --require-hashes -r requirements/build.lock
          python -m build --no-isolation --outdir dist-a
          python -m build --no-isolation --outdir dist-b
          diff \
            <(find dist-a -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find dist-b -maxdepth 1 -type f -printf '%f\n' | sort)
          for artifact in dist-a/*; do
            cmp "$artifact" "dist-b/$(basename "$artifact")"
          done
          mv dist-a dist
          rm -rf dist-b
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/shadowshield-smoke
          /tmp/shadowshield-smoke/bin/pip install dist/*.whl
          /tmp/shadowshield-smoke/bin/shadowshield --version
          /tmp/shadowshield-smoke/bin/shadowshield scan --text "hello"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit declared dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2" "pip-audit==2.10.1"
          python -m pip_audit .
          python -m pip_audit --no-deps --disable-pip \
            -r requirements/container.lock
          python -m pip_audit --no-deps --disable-pip \
            -r requirements/build.lock

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  container:
    name: container security smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag shadowshield-ci:${{ github.sha }} .
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shadowshield-ci:${{ github.sha }}
          format: cyclonedx
          output: shadowshield-sbom.cdx.json
          exit-code: "0"
      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: shadowshield-sbom.cdx.json
          retention-days: 30
      - name: Reject fixable high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shadowshield-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
      - name: Verify fail-closed startup and hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          image="shadowshield-ci:${{ github.sha }}"
          name="shadowshield-ci"
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ] && docker inspect "$name" >/dev/null 2>&1; then
              docker logs "$name" || true
              docker inspect --format \
                'state={{.State.Status}} health={{.State.Health.Status}} error={{json .State.Error}}' \
                "$name" || true
            fi
            docker rm --force "$name" >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT

          if docker run --rm "$image"; then
            echo "image started without required keys"
            exit 1
          fi
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "shadowshield"

          docker run --detach --name "$name" \
            --read-only --tmpfs /tmp:size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 1s --health-timeout 3s \
            --health-start-period 1s --health-retries 3 \
            -e SHADOWSHIELD_API_KEY=ci-api-key \
            -e SHADOWSHIELD_ADMIN_KEY=ci-admin-key \
            -e SHADOWSHIELD_POLICY_KEY=ci-policy-key \
            -e SHADOWSHIELD_POLICY_STATE_PATH=/tmp/policy-state.json \
            -e SHADOWSHIELD_POLICY_STATE_KEY=ci-policy-state-key-0123456789abcdef \
            -p 127.0.0.1:18080:8000 "$image"

          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:18080/ready | grep '"ready":true'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"text":"malformed"' http://127.0.0.1:18080/scan)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'x-api-key: ci-api-key' -H 'content-type: application/json' \
            -d '{"text":"hello","direction":"input"}' http://127.0.0.1:18080/scan)" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/oversized.json").write_text(json.dumps({"text": "x" * 1_100_000}))
          PY
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'x-api-key: ci-api-key' -H 'content-type: application/json' \
            --data-binary @/tmp/oversized.json http://127.0.0.1:18080/scan)" = "413"
          for _ in $(seq 1 10); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = "healthy"
