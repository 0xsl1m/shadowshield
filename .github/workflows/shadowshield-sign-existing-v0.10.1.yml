# LOCAL PROPOSAL ONLY. Intended repository path after separate approval:
# .github/workflows/shadowshield-sign-existing-v0.10.1.yml
# This workflow never builds, retags, or deploys the image.
name: Sign existing ShadowShield v0.10.1 digest

on:
  workflow_dispatch: {}

concurrency:
  group: shadowshield-existing-v0.10.1-signature
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign-existing-digest:
    if: github.repository == '0xsl1m/shadowshield' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify original release evidence, sign exact digest, and verify signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # No event input, tag, or mutable image reference can select the target.
          image='ghcr.io/0xsl1m/shadowshield@sha256:00c3b59e5e100fea1abb2e337e5baa5c6a17969df70260fb890917ef4ef9c0d0'
          oci_image="oci://$image"
          source_sha='80ca8f5db07985b199d6f3d8aa65b232286d003a'
          original_identity='https://github.com/0xsl1m/shadowshield/.github/workflows/container-release.yml@refs/tags/v0.10.1'
          recovery_identity='https://github.com/0xsl1m/shadowshield/.github/workflows/shadowshield-sign-existing-v0.10.1.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          bundle_digest='00c3b59e5e100fea1abb2e337e5baa5c6a17969df70260fb890917ef4ef9c0d0'

          test "$GITHUB_REPOSITORY" = '0xsl1m/shadowshield'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_WORKFLOW_REF" = '0xsl1m/shadowshield/.github/workflows/shadowshield-sign-existing-v0.10.1.yml@refs/heads/main'

          work="$(mktemp -d)"
          export DOCKER_CONFIG="$work/docker"
          mkdir -m 0700 "$DOCKER_CONFIG" "$work/provenance" "$work/sbom"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$work"' EXIT

          # Release URLs and SHA-256 values are fixed from the official GitHub
          # release assets; there are no third-party Actions or floating tags.
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --show-error --location --retry 3 \
            --output "$work/gh.tar.gz" \
            'https://github.com/cli/cli/releases/download/v2.87.3/gh_2.87.3_linux_amd64.tar.gz'
          printf '%s  %s\n' \
            'c6e5537631fca45f277ef405ce8751d139b491e9402cc20891a003525a8773b2' \
            "$work/gh.tar.gz" | sha256sum --check --status
          tar -xzf "$work/gh.tar.gz" -C "$work" gh_2.87.3_linux_amd64/bin/gh
          gh_bin="$work/gh_2.87.3_linux_amd64/bin/gh"
          test "$("$gh_bin" --version | head -n 1)" = 'gh version 2.87.3 (2026-02-23)'

          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --show-error --location --retry 3 \
            --output "$work/cosign" \
            'https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64'
          printf '%s  %s\n' \
            '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71' \
            "$work/cosign" | sha256sum --check --status
          chmod 0700 "$work/cosign"
          cosign_bin="$work/cosign"

          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null

          test "$("$gh_bin" api repos/0xsl1m/shadowshield/git/ref/tags/v0.10.1 \
            --jq '[.object.type, .object.sha] | join(" ")')" = "commit $source_sha"

          (
            cd "$work/provenance"
            "$gh_bin" attestation download "$oci_image" \
              --repo 0xsl1m/shadowshield \
              --predicate-type https://slsa.dev/provenance/v1
          )
          (
            cd "$work/sbom"
            "$gh_bin" attestation download "$oci_image" \
              --repo 0xsl1m/shadowshield \
              --predicate-type https://cyclonedx.org/bom
          )
          # gh uses a colon on Linux and a hyphen on Windows. Accept only one
          # downloaded file per predicate, bound to the hardcoded image digest.
          shopt -s nullglob
          resolve_bundle() {
            local directory="$1"
            local files=("$directory"/*.jsonl)
            [[ "${#files[@]}" -eq 1 ]] || return 1
            case "${files[0]##*/}" in
              "sha256:$bundle_digest.jsonl"|"sha256-$bundle_digest.jsonl") ;;
              *) return 1 ;;
            esac
            [[ -s "${files[0]}" ]] || return 1
            printf '%s\n' "${files[0]}"
          }
          provenance_bundle="$(resolve_bundle "$work/provenance")"
          sbom_bundle="$(resolve_bundle "$work/sbom")"

          for predicate in provenance sbom; do
            if [[ "$predicate" == provenance ]]; then
              predicate_type='https://slsa.dev/provenance/v1'
              bundle_file="$provenance_bundle"
            else
              predicate_type='https://cyclonedx.org/bom'
              bundle_file="$sbom_bundle"
            fi
            "$gh_bin" attestation verify "$oci_image" \
              --repo 0xsl1m/shadowshield \
              --bundle "$bundle_file" \
              --predicate-type "$predicate_type" \
              --cert-identity "$original_identity" \
              --cert-oidc-issuer "$issuer" \
              --signer-digest "$source_sha" \
              --source-digest "$source_sha" \
              --source-ref refs/tags/v0.10.1 \
              --deny-self-hosted-runners
          done

          # The only registry publication: an additive keyless signature for
          # the existing immutable image digest, never a tag or image push.
          "$cosign_bin" sign --yes "$image"
          "$cosign_bin" verify \
            --certificate-identity "$recovery_identity" \
            --certificate-oidc-issuer "$issuer" \
            "$image"
