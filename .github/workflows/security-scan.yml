name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep (catches newly disclosed patterns against history)
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — secrets hide in old commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  # NOTE: CodeQL is intentionally not run here as an advanced configuration.
  # This repo uses GitHub's CodeQL *default setup* (Settings → Code security),
  # which already analyzes python + actions on every push/PR. An advanced
  # workflow submission is rejected with "cannot be processed when the default
  # setup is enabled".
